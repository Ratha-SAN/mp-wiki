<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sib-title sib-desc">
  <title id="sib-title">Sequential boost vs. Simultaneous Integrated Boost (SIB), head-and-neck example</title>
  <desc id="sib-desc">Comparison of a sequential boost schedule, where PETV, PCTV and PGTV are treated one after another over 33 fractions, versus SIB, where all three volumes are treated concurrently every fraction at three different dose-per-fraction levels giving the same total dose and BED to each volume.</desc>
  <rect x="0" y="0" width="640" height="340" fill="#ffffff"/>

  <!-- Panel A: Sequential -->
  <text x="60" y="24" font-family="sans-serif" font-size="14" font-weight="bold" fill="#334155">A. Sequential boost — 33 fractions, one volume "active" at a time</text>

  <rect x="60" y="40" width="378.8" height="26" fill="#bfdbfe" stroke="#1e3a8a" stroke-width="1"/>
  <text x="249" y="57" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1e3a8a">PETV: 53 Gy / 25 fx @ 2.12 Gy</text>

  <rect x="438.8" y="40" width="45.5" height="26" fill="#93c5fd" stroke="#1e3a8a" stroke-width="1"/>
  <rect x="484.3" y="40" width="75.7" height="26" fill="#60a5fa" stroke="#1e3a8a" stroke-width="1"/>
  <text x="522" y="90" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#1e3a8a">PCTV +3 fx / PGTV +5 fx boost</text>
  <line x1="461.6" y1="70" x2="522" y2="84" stroke="#1e3a8a" stroke-width="0.8"/>

  <line x1="60" y1="74" x2="560" y2="74" stroke="#94a3b8" stroke-width="1"/>
  <text x="310" y="88" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#64748b">33 fractions total, delivered in series</text>

  <!-- Panel B: SIB -->
  <text x="60" y="130" font-family="sans-serif" font-size="14" font-weight="bold" fill="#334155">B. SIB — same 33 fractions, all three volumes treated every day</text>

  <!-- PGTV bottom, tallest bar (highest dose/fx) -->
  <rect x="60" y="270" width="500" height="42" fill="#1d4ed8" stroke="#1e3a8a" stroke-width="1"/>
  <text x="70" y="295" font-family="sans-serif" font-size="11" fill="#ffffff">PGTV: 69.96 Gy / 33 fx @ 2.12 Gy/fx</text>

  <!-- PCTV middle -->
  <rect x="60" y="222" width="500" height="36" fill="#3b82f6" stroke="#1e3a8a" stroke-width="1"/>
  <text x="70" y="245" font-family="sans-serif" font-size="11" fill="#ffffff">PCTV: 59.36 Gy / 33 fx @ 1.80 Gy/fx</text>

  <!-- PETV top, shortest bar (lowest dose/fx) -->
  <rect x="60" y="180" width="500" height="30" fill="#93c5fd" stroke="#1e3a8a" stroke-width="1"/>
  <text x="70" y="200" font-family="sans-serif" font-size="11" fill="#1e3a8a">PETV: 53 Gy / 33 fx @ 1.61 Gy/fx</text>

  <text x="310" y="326" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#64748b">Bar height ~ dose per fraction — each volume reaches the same total dose and BED as panel A, concurrently</text>
</svg>
