<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Wiki</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='9' r='4' fill='%234a3aa7'/%3E%3Ccircle cx='7' cy='24' r='3.5' fill='%234a3aa7'/%3E%3Ccircle cx='25' cy='24' r='3.5' fill='%23eb6834'/%3E%3Cg stroke='%238a8a85' stroke-width='1.6'%3E%3Cpath d='M16 13 8 21M16 13l8 8M9 24h13'/%3E%3C/g%3E%3C/svg%3E" />
  </head>
  <body>
    <div class="bg-decor" aria-hidden="true">
      <span class="bg-blob bg-blob-1"></span>
      <span class="bg-blob bg-blob-2"></span>
      <span class="bg-blob bg-blob-3"></span>
      <span class="bg-blob bg-blob-4"></span>
    </div>
    <div id="app" data-view="reader">
      <header class="topbar">
        <button class="icon-button nav-toggle" id="sidebar-toggle" aria-label="Toggle file explorer" aria-pressed="true">
          <span class="bars" aria-hidden="true"></span>
        </button>
        <span class="logo-badge" aria-hidden="true"></span>
        <h1 class="site-title" id="site-title">Wiki</h1>
        <p class="vault-stats" id="vault-stats"></p>
        <button class="icon-button" id="theme-toggle" aria-label="Switch colour theme">
          <span id="theme-icon" aria-hidden="true">◐</span>
        </button>
      </header>

      <main class="panes" id="panes">
        <aside class="pane pane-files" id="pane-files" aria-label="File explorer">
          <div class="search">
            <input
              id="search-input"
              type="search"
              placeholder="Search titles and paths…"
              autocomplete="off"
              spellcheck="false"
              aria-label="Search notes"
            />
          </div>
          <div class="tree-scroll" id="tree-scroll">
            <div class="tree" id="tree" role="tree" aria-label="Vault"></div>
            <ul class="results" id="results" role="listbox" hidden></ul>
          </div>
        </aside>

        <div class="splitter" id="splitter-files" role="separator" aria-orientation="vertical" tabindex="0" aria-label="Resize file explorer"></div>

        <section class="pane pane-reader" id="pane-reader" aria-label="Note">
          <div class="reader-scroll" id="reader-scroll">
            <article class="note" id="note"></article>
          </div>
        </section>

        <div class="splitter" id="splitter-graph" role="separator" aria-orientation="vertical" tabindex="0" aria-label="Resize graph"></div>

        <section class="pane pane-graph" id="pane-graph" aria-label="Graph"></section>
      </main>

      <nav class="tabbar" aria-label="Panes">
        <button data-view="files">Files</button>
        <button data-view="reader" class="is-active">Note</button>
        <button data-view="graph">Graph</button>
      </nav>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
